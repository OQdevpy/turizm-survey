# Render.com — Blueprint konfiguratsiya
# https://render.com/docs/blueprint-spec
#
# Birinchi marta deploy: https://dashboard.render.com → New + → Blueprint → repo ulang
# Bu fayl avto-tarzda Web Service + PostgreSQL yaratadi

databases:
  - name: turizm-db
    plan: free  # 90 kun bepul (1 GB), keyin $7/oy
    databaseName: turizm
    user: turizm_user
    region: frankfurt  # Tashkent uchun eng yaqin

services:
  - type: web
    name: turizm-survey
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --threads 2 --timeout 60 --log-file -"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # PostgreSQL — render avto-bog'laydi
      - key: DATABASE_URL
        fromDatabase:
          name: turizm-db
          property: connectionString
      - key: RECAPTCHA_PUBLIC_KEY
        value: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
      - key: RECAPTCHA_PRIVATE_KEY
        value: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
      - key: WEB_CONCURRENCY
        value: "2"
